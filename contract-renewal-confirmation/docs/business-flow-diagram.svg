<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>契約更新の本人意思確認 業務フロー</title>
<desc>週次同期から候補抽出、営業事務による送信（送信前に個別確認で解決した場合は直接Excel転記へ）、本人の回答、アシスタント対応、Excel台帳への転記までの流れ</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
  .box-gray{fill:#f1f5f9;stroke:#94a3b8;}
  .box-teal{fill:#ccfbf1;stroke:#0d9488;}
  .th{font:600 14px sans-serif;fill:#1e293b;}
  .ts{font:400 12px sans-serif;fill:#64748b;}
  .arr{stroke:#64748b;stroke-width:1.5;}
</style>

<rect class="box-gray" x="180" y="40" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle">週次自動同期</text>
<text class="ts" x="340" y="76" text-anchor="middle">Excel台帳から取り込み</text>
<line x1="340" y1="96" x2="340" y2="136" class="arr" marker-end="url(#arrow)"/>

<rect class="box-gray" x="180" y="136" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="154" text-anchor="middle">候補を自動抽出</text>
<text class="ts" x="340" y="172" text-anchor="middle">契約開始日の1.5ヶ月前</text>
<line x1="340" y1="192" x2="340" y2="232" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="164" x2="520" y2="164" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="520" y="136" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="590" y="154" text-anchor="middle">個別確認で解決</text>
<text class="ts" x="590" y="172" text-anchor="middle">送信せず記録</text>
<polyline points="590,192 590,600 490,600 490,616" fill="none" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="180" y="232" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="250" text-anchor="middle">営業事務が送信</text>
<text class="ts" x="340" y="268" text-anchor="middle">候補を確認し送信</text>
<line x1="340" y1="288" x2="340" y2="328" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="180" y="328" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="346" text-anchor="middle">本人へメール送信</text>
<text class="ts" x="340" y="364" text-anchor="middle">e-gravity.co.jpから</text>
<line x1="300" y1="384" x2="230" y2="424" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="384" x2="450" y2="424" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="130" y="424" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="230" y="442" text-anchor="middle">本人承諾</text>
<text class="ts" x="230" y="460" text-anchor="middle">確認画面で操作</text>

<rect class="box-teal" x="350" y="424" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="450" y="442" text-anchor="middle">相談したい／無反応</text>
<text class="ts" x="450" y="460" text-anchor="middle">要フォロー</text>
<line x1="450" y1="480" x2="450" y2="520" class="arr" marker-end="url(#arrow)"/>

<rect class="box-teal" x="350" y="520" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="450" y="538" text-anchor="middle">アシスタントが対応</text>
<text class="ts" x="450" y="556" text-anchor="middle">個別確認</text>

<line x1="230" y1="480" x2="230" y2="616" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="576" x2="450" y2="616" class="arr" marker-end="url(#arrow)"/>

<rect class="box-gray" x="180" y="616" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="634" text-anchor="middle">Excelへ転記</text>
<text class="ts" x="340" y="652" text-anchor="middle">営業事務が手動記入</text>
</svg>
